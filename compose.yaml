services:
  atelier:
    image: ghcr.io/federicokalik/atelier-craft:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${HUB_PORT:-8080}:8080"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      UPDATE_INTERVAL_HOURS: ${UPDATE_INTERVAL_HOURS:-12}
      DISCOVER_FUTURE_APPS: ${DISCOVER_FUTURE_APPS:-true}
      TRANSLATE_URL: ${TRANSLATE_URL:-}
      TRANSLATE_API_KEY: ${TRANSLATE_API_KEY:-}
    volumes:
      - app_data:/srv/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  translate:
    image: libretranslate/libretranslate:v1.9.6
    profiles: [translations]
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,it,fr,nl,de,es,pt
      LT_THREADS: 1
    volumes:
      - translate_models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD", "./venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  app_data:
  translate_models:
