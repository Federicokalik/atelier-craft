services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HUB_PORT:-8080}:8080"
    volumes:
      - ./web:/srv/web:ro
      - app_data:/srv/data:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - updater

  updater:
    image: python:3.12-alpine
    restart: unless-stopped
    command: ["python", "/srv/updater/update.py", "--loop"]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      UPDATE_INTERVAL_HOURS: ${UPDATE_INTERVAL_HOURS:-12}
      DISCOVER_FUTURE_APPS: ${DISCOVER_FUTURE_APPS:-true}
    volumes:
      - ./updater:/srv/updater:ro
      - app_data:/srv/data

volumes:
  app_data:
