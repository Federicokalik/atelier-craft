services:
  atelier:
    image: ghcr.io/federicokalik/atelier-craft:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${HUB_PORT:-8080}:8080"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      UPDATE_INTERVAL_HOURS: ${UPDATE_INTERVAL_HOURS:-12}
      DISCOVER_FUTURE_APPS: ${DISCOVER_FUTURE_APPS:-true}
    volumes:
      - app_data:/srv/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app_data:
